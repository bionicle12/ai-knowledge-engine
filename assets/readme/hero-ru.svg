<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">AI Knowledge Engine</title>
  <desc id="desc">Локальная система, которая проводит исходные файлы через обработку и проверку, превращая их в структурированные знания и готовый контекст для AI.</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="1" stop-color="#0B1728"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#203149" stroke-width="1" opacity=".28"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#62D8FF"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#surface)"/>
  <path d="M0 330C270 275 375 420 665 350C850 305 1005 322 1200 252V420H0Z"
        fill="#0D1C30" opacity=".78"/>
  <rect x="706" width="494" height="420" fill="url(#grid)"/>
  <path d="M706 0V420" stroke="#203149" stroke-width="1"/>

  <g id="title-block" transform="translate(60 54)">
    <text x="0" y="0" fill="#62D8FF" font-size="17" font-weight="700"
          letter-spacing="2.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      ЛОКАЛЬНО · ПОД УПРАВЛЕНИЕМ АГЕНТА · MARKDOWN
    </text>

    <text x="0" y="82" fill="#F3F7FF" font-size="64" font-weight="750"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      AI Knowledge
    </text>
    <text x="0" y="148" fill="#F3F7FF" font-size="64" font-weight="750"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      Engine
    </text>

    <text x="2" y="204" fill="#B8C5D8" font-size="22" font-weight="450"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      Долговременная память для AI-агента,
    </text>
    <text x="2" y="234" fill="#B8C5D8" font-size="22" font-weight="450"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      который уже работает внутри вашего проекта.
    </text>

    <g transform="translate(0 286)"
       font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
       font-size="17" font-weight="650">
      <rect width="112" height="38" rx="19" fill="#10243A" stroke="#2B4964"/>
      <text x="20" y="25" fill="#F3F7FF">v0.11.0</text>

      <rect x="126" width="218" height="38" rx="19" fill="#10243A" stroke="#2B4964"/>
      <text x="146" y="25" fill="#F3F7FF">16 модулей инструкций</text>

      <rect x="358" width="190" height="38" rx="19" fill="#10243A" stroke="#2B4964"/>
      <text x="378" y="25" fill="#F3F7FF">15 шаблонов ролей</text>
    </g>
  </g>

  <g id="project-proof" transform="translate(724 44)">
    <text x="0" y="0" fill="#8A9BB5" font-size="18" font-weight="700"
          letter-spacing="1.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      ЛОКАЛЬНЫЙ МАРШРУТ ЗНАНИЙ
    </text>

    <g transform="translate(0 30)">
      <rect width="202" height="76" rx="16" fill="#101F33" stroke="#2B4964"/>
      <text x="20" y="31" fill="#F3F7FF" font-size="22" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">raw/</text>
      <text x="20" y="57" fill="#8A9BB5" font-size="18"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">файлы · медиа · чаты</text>
    </g>

    <path d="M101 108V137H228V157" fill="none" stroke="#62D8FF"
          stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(100 160)">
      <rect width="256" height="86" rx="16" fill="#10243A" stroke="#62D8FF" stroke-width="1.5"/>
      <circle cx="24" cy="25" r="6" fill="#62D8FF"/>
      <text x="42" y="32" fill="#F3F7FF" font-size="22" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">kb_ingest.py</text>
      <text x="20" y="62" fill="#AFC0D5" font-size="18"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">конвертация · NLP · хеш</text>
    </g>

    <path d="M228 248V275H94V295M228 275H354V295" fill="none"
          stroke="#62D8FF" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(0 298)">
      <rect width="190" height="76" rx="16" fill="#10281F" stroke="#4F9F67"/>
      <text x="20" y="31" fill="#7EE787" font-size="22" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">knowledge/</text>
      <text x="20" y="57" fill="#B7CFBF" font-size="18"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">проверено · связано</text>
    </g>

    <g transform="translate(250 298)">
      <rect width="198" height="76" rx="16" fill="#101F33" stroke="#2B4964"/>
      <text x="20" y="31" fill="#F3F7FF" font-size="20" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">AI-контекст</text>
      <text x="20" y="57" fill="#8A9BB5" font-size="18"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.repomix/output.xml</text>
    </g>

    <path d="M190 336H244" fill="none" stroke="#7EE787"
          stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
