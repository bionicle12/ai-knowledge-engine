name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for kb_upgrade tag-based diffs

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: knowledge-base/templates/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml python-slugify python-frontmatter pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=knowledge-base/scripts \
            --cov=scripts \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  doctor:
    name: Doctor self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: knowledge-base/templates/requirements.txt
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml python-slugify
      - name: Run kb_doctor self-test
        run: python knowledge-base/scripts/kb_doctor.py --self-test --skip-nlp

  lint-shell:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Check shell scripts syntax
        run: |
          for f in $(find . -name '*.sh' -not -path './.venv/*' -not -path './node_modules/*'); do
            echo "Checking $f"
            bash -n "$f"
          done
      - name: Run shellcheck (warnings only, non-blocking)
        continue-on-error: true
        run: |
          shellcheck \
            --severity=warning \
            $(find . -name '*.sh' -not -path './.venv/*' -not -path './node_modules/*')

  validate-yaml:
    name: Validate YAML configs and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate role examples
        run: |
          python <<'PY'
          import sys
          import yaml
          from pathlib import Path
          ok = True
          for p in Path("knowledge-base/examples").glob("*.yml"):
              try:
                  data = yaml.safe_load(p.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"FAIL {p}: {e}")
                  ok = False
                  continue
              if not isinstance(data, dict) or "role" not in data:
                  print(f"FAIL {p}: missing 'role' key")
                  ok = False
                  continue
              print(f"OK   {p.name}: role={data['role'][:50]}")
          sys.exit(0 if ok else 1)
          PY
      - name: Validate kb.config.yml.template
        run: |
          python <<'PY'
          import yaml
          # The template has {{placeholders}} which are not valid YAML strings in
          # all positions, but the structure should still parse if we strip them.
          import re
          text = open("knowledge-base/templates/kb.config.yml.template").read()
          # Replace placeholder-only values with quoted dummy strings for validation
          text = re.sub(r"(:\s*)(\{\{[^}]+\}\})", r'\1"\2"', text)
          yaml.safe_load(text)
          print("OK kb.config.yml.template parses")
          PY

  check-translations:
    name: Translation drift report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run check_translations
        # Don't fail the build on stale translations — just surface the report.
        continue-on-error: true
        run: |
          python scripts/check_translations.py
