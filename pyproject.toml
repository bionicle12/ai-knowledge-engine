[tool.pytest.ini_options]
testpaths = [
    "knowledge-base/scripts/tests",
    "scripts/tests",
    "tools/ai-skills-fixer/tests",
]
# importlib mode avoids module-name collisions between nested test directories.
addopts = "-q --import-mode=importlib"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
