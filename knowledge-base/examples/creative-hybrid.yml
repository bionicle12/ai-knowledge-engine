# Пример: Креативный гибрид (Программист + Музыка + Геймдев)

role: "Creative Hybrid: Software Engineer + Music Producer + Game Developer"

description: |
  Основная профессия — программист (middle+/senior). Параллельно развивает
  два творческих хобби: AI-assisted музыкальное производство и разработку
  инди-игр. Не профессиональный музыкант — не знает нот, не пишет аранжировки
  "по науке", но создаёт полноценные треки: генерирует AI-песни, вырезает стемы,
  дозаписывает, сводит и доводит до вида "не-AI песни". Игры разрабатывает
  full-stack с помощью AI-агентов.

  AI-помощник в этой роли — "более умная версия себя", с которой можно:
  - обсуждать рабочие задачи программирования
  - планировать и улучшать музыкальный workflow
  - обсуждать геймдизайн, механики и визуал игры
  - получать межпредметные инсайты (код → музыка, музыка → геймдев)
  - развиваться как мультидисциплинарный специалист

entities:
  # === ПРОГРАММИРОВАНИЕ (основа) ===
  tech_stack:
    enabled: true
    why: "Стек, предпочтения, архитектурные решения"
    knowledge_paths:
      - "knowledge/domain/tech-stack.md"

  code_principles:
    enabled: true
    why: "Принципы кода, стиль, подходы к решению задач"
    knowledge_paths:
      - "knowledge/principles/code-quality.md"
      - "knowledge/voice/code-style.md"

  # === МУЗЫКА (хобби) ===
  music_workflow:
    enabled: true
    why: "Процесс создания трека: генерация → стемы → дозапись → сведение"
    knowledge_paths:
      - "knowledge/playbooks/music-production.md"
      - "knowledge/domain/music-tools.md"

  music_taste:
    enabled: true
    why: "Музыкальные предпочтения, референсы, что нравится в звучании"
    knowledge_paths:
      - "knowledge/voice/music-taste.md"
      - "knowledge/domain/music-references.md"

  music_projects:
    enabled: true
    why: "Готовые треки, эксперименты, что получилось/не получилось"
    knowledge_paths:
      - "knowledge/projects/music/"

  # === ГЕЙМДЕВ (хобби) ===
  game_design:
    enabled: true
    why: "Механики, визуал, геймплей, UX, монетизация"
    knowledge_paths:
      - "knowledge/domain/game-design.md"
      - "knowledge/playbooks/game-feature-development.md"

  game_projects:
    enabled: true
    why: "Игровые проекты, прогресс, решения, кейсы"
    knowledge_paths:
      - "knowledge/projects/games/"

  game_tech:
    enabled: true
    why: "Технический стек игр: PixiJS, React, Rust, WebSocket"
    knowledge_paths:
      - "knowledge/domain/game-tech-stack.md"

  # === МЕЖПРЕДМЕТНОЕ ===
  cross_domain:
    enabled: true
    why: "Связи между доменами: как программирование помогает в музыке, как геймдев влияет на код"
    knowledge_paths:
      - "knowledge/principles/cross-domain-insights.md"

  creative_process:
    enabled: true
    why: "Как автор подходит к творчеству, что вдохновляет, как принимает решения"
    knowledge_paths:
      - "knowledge/profile/creative-process.md"
      - "knowledge/principles/creative-quality.md"

  personal_growth:
    enabled: true
    why: "Траектория развития, цели, что хочу освоить"
    knowledge_paths:
      - "knowledge/timelines/growth-path.md"
      - "knowledge/open-questions/"

raw_data_examples:
  - "Код проектов и конфиги"
  - "Заметки по геймдизайну и механикам"
  - "Стемы, миксы, проекты DAW (описания, не бинарники)"
  - "Скриншоты и видео геймплея"
  - "Референсы: треки, игры, статьи"
  - "Переписки по проектам"
  - "Аудиозаписи джемов и экспериментов"
  - "Черновики текстов песен"

ai_assistant_tasks:
  # Программирование
  - "Код-ревью и архитектурные советы"
  - "Дебаг и решение технических проблем"
  - "Выбор технологий с обоснованием"

  # Музыка
  - "Обсуждение структуры трека и аранжировки"
  - "Советы по сведению и мастерингу (с учётом что я не про)"
  - "Подбор инструментов и плагинов"
  - "Анализ референсных треков — что делает их хорошими"
  - "Помощь с текстами песен"

  # Геймдев
  - "Обсуждение игровых механик и баланса"
  - "Визуальный стиль и UI/UX игры"
  - "Планирование фич и roadmap"
  - "Ревью геймдизайн-решений"

  # Межпредметное
  - "Связи между доменами: что из кода применимо в музыке?"
  - "Приоритизация хобби vs. работа"
  - "Цифровой двойник: обсуждение идей с 'более умной версией себя'"
  - "Рефлексия: что получается, что нет, куда расти"

# Примеры полезных диалогов с AI-агентом в этой роли:
example_conversations:
  - topic: "Структура нового трека"
    example: |
      "У меня есть AI-сгенерированный бит в стиле lo-fi hip-hop.
       Хочу вырезать стемы, заменить бас на синтезаторный и добавить
       живую гитару. Какой порядок действий и какие инструменты?"

  - topic: "Геймдизайн решение"
    example: |
      "В моей игре-кликере есть система корпораций. Стоит ли добавлять
       PvP между корпорациями или лучше кооперативные цели? Какие
       плюсы и минусы с точки зрения retention?"

  - topic: "Межпредметный инсайт"
    example: |
      "Я заметил, что мой подход к рефакторингу кода похож на то,
       как я свожу треки — итеративно, слой за слоем. Это паттерн?
       Как его можно использовать сознательно?"

  - topic: "Карьера и рост"
    example: |
      "Я хочу через год начать зарабатывать на музыке.
       Какой реалистичный план, учитывая что я не знаю нот
       и работаю full-time программистом?"

# ============================================================
# Initial population helper (read by 14_INITIAL_POPULATION.md)
# ============================================================
placement_examples:
  intro: |
    Ты — мультидисциплинарный человек: программист по основной работе,
    музыкант и геймдев в качестве хобби. У тебя гораздо больше
    разнородных артефактов, чем у узкого специалиста. База знаний
    собирает их в единое целое, чтобы AI понимал тебя как
    "одного человека с тремя гранями", а не как набор разрозненных
    сессий.

  by_artifact:
    - artifact: "Код, конфиги, ADR из рабочих проектов"
      destination: "raw/reference/unsorted/"
      examples:
        - "ADR-001 выбор Rust для бэкенда.md"
        - "Красивый GitHub Actions workflow.yml"
      knowledge_target: "knowledge/domain/tech-stack.md"

    - artifact: "Заметки по геймдизайну, балансу, механикам"
      destination: "raw/work/unsorted/"
      examples:
        - "Game-design: economy v3.md"
        - "Идея: PvP между корпорациями.md"
      knowledge_target: "knowledge/domain/game-design.md"

    - artifact: "Скриншоты и видео геймплея"
      destination: "raw/media/unsorted/"
      examples:
        - "playtest-2026-05-15.mp4"
        - "ui-iteration-3.png"
      knowledge_target: "knowledge/projects/games/"

    - artifact: "Описания музыкальных проектов и треков"
      destination: "raw/work/unsorted/"
      examples:
        - "Track-A-mixing-notes.md"
        - "Stem-extraction-workflow.md"
      knowledge_target: "knowledge/playbooks/music-production.md"
      tip: "Проекты DAW (.als, .flp) клади как описание/notes, не сами файлы — они бинарные и большие."

    - artifact: "Тексты песен и драфты"
      destination: "raw/personal-context/unsorted/"
      examples:
        - "lyrics-draft-1.md"
        - "Idea-for-chorus.txt"
      knowledge_target: "knowledge/voice/songwriting-style.md"
      tip: "Личный творческий артефакт — lifecycle: permanent (не устаревает)."

    - artifact: "Референсы: треки, игры, статьи"
      destination: "raw/reference/unsorted/"
      examples:
        - "Reference-track-analysis.md"
        - "blog-post-procedural-generation.pdf"
      knowledge_target: "knowledge/domain/music-references.md"

    - artifact: "Записи джемов и музыкальных экспериментов"
      destination: "raw/media/unsorted/"
      examples:
        - "jam-2026-05-15.mp3"
        - "vocal-take-3.wav"

    - artifact: "Межпредметные инсайты"
      destination: "raw/personal-context/unsorted/"
      examples:
        - "Как рефакторинг похож на сведение трека.md"
        - "Game economy ↔ распределённые системы.md"
      knowledge_target: "knowledge/principles/cross-domain-insights.md"

  quickstart:
    - "Положи 1 заметку про принцип, который применяешь во всех 3 областях → raw/personal-context/unsorted/"
    - "Любой README одного из своих рабочих или хобби-проектов → raw/reference/unsorted/"
    - "Скриншот текущего game UI или music DAW → raw/media/unsorted/"
    - "Запусти ./shell/reindex.sh — AI начнёт понимать твою мультидисциплинарность"
    - "Спроси AI: 'Что объединяет мой подход к коду и к музыке?' — после нескольких добавлений ответ будет содержательным"

  do_not_drop:
    - "Бинарные DAW-проекты (.als, .flp) — кладите описания, не файлы"
    - "Чужие сэмплы и стемы без лицензии"
    - "Чужой код без явной лицензии"
    - "API-ключи и секреты"
    - "Персональные данные коллег и партнёров"
