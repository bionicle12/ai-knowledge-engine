# Пример: Директор по маркетингу

role: "Директор по маркетингу"

description: |
  Руководитель маркетинга, отвечающий за стратегию, каналы, бренд,
  аудиторию, кампании и метрики роста. AI-помощник помогает с анализом
  рынка, конкурентов, планированием кампаний и стилем коммуникации.

entities:
  brand:
    enabled: true
    why: "Позиционирование, tone of voice, визуальный вкус, брендовые правила"
    knowledge_paths:
      - "knowledge/domain/brand.md"
      - "knowledge/voice/brand-voice.md"

  audience:
    enabled: true
    why: "Сегменты, боли, JTBD, интервью, возражения, инсайты"
    knowledge_paths:
      - "knowledge/domain/audience.md"
      - "knowledge/playbooks/customer-interviewing.md"

  campaigns:
    enabled: true
    why: "Запуски, каналы, гипотезы, результаты, lessons learned"
    knowledge_paths:
      - "knowledge/projects/"
      - "knowledge/playbooks/campaign-planning.md"

  competitors:
    enabled: true
    why: "Рынок, альтернативы, сильные и слабые стороны конкурентов"
    knowledge_paths:
      - "knowledge/domain/competitors.md"

  metrics:
    enabled: true
    why: "KPI, воронки, retention, CAC, LTV, payback, north star"
    knowledge_paths:
      - "knowledge/domain/metrics.md"

  decisions:
    enabled: true
    why: "Что решили, почему, на каких данных, какой результат"
    knowledge_paths:
      - "knowledge/decisions/"

  voice:
    enabled: true
    why: "Стиль письма, презентаций, объяснений, продаж и публичной коммуникации"
    knowledge_paths:
      - "knowledge/voice/"

  playbooks:
    enabled: true
    why: "Повторяемые схемы: запуск кампании, аудит, исследование, бриф"
    knowledge_paths:
      - "knowledge/playbooks/"

raw_data_examples:
  - "PDF-отчёты об исследованиях рынка"
  - "Презентации стратегий и результатов"
  - "Экспорты рабочих чатов (Telegram, Slack)"
  - "Таблицы KPI и воронок"
  - "Записи созвонов с командой и клиентами"
  - "Брендбуки и гайдлайны"
  - "Примеры любимой рекламы и референсы"

ai_assistant_tasks:
  - "Анализ конкурентов и рынка"
  - "Подготовка стратегий и планов"
  - "Написание текстов в tone of voice бренда"
  - "Аудит кампаний и каналов"
  - "Подготовка брифов для подрядчиков"
  - "Анализ воронки и метрик"
  - "Генерация гипотез для экспериментов"

# ============================================================
# Initial population helper (read by 14_INITIAL_POPULATION.md)
# ============================================================
placement_examples:
  intro: |
    Если ты директор по маркетингу или лидер маркетинговой команды,
    у тебя точно есть: исследования рынка, презентации стратегий,
    отчёты по кампаниям, экспорты дашбордов, заметки с интервью.
    Всё это превращается в персональный movement engine, который
    помогает AI давать рекомендации в твоём tone of voice и с
    пониманием твоих принципов.

  by_artifact:
    - artifact: "Исследования рынка и сегментации"
      destination: "raw/documents/unsorted/"
      examples:
        - "Q2-2026 Market Sizing.pdf"
        - "Customer Segmentation Report.docx"
      knowledge_target: "knowledge/domain/audience.md"

    - artifact: "Презентации стратегий и результатов"
      destination: "raw/documents/unsorted/"
      examples:
        - "Q2 Brand Strategy.pptx"
        - "2026-Annual-Review.pptx"
      knowledge_target: "knowledge/projects/"
      tip: "Текст слайдов извлечётся через python-pptx; визуалы — в assets/."

    - artifact: "Брифы кампаний и креативные брифы"
      destination: "raw/work/unsorted/"
      examples:
        - "Brief: летняя кампания 2026.md"
        - "Креативный бриф для агентства X.docx"
      knowledge_target: "knowledge/playbooks/campaign-planning.md"

    - artifact: "Записи созвонов с командой/клиентами/инвесторами"
      destination: "raw/media/unsorted/"
      examples:
        - "Discovery call с клиентом A.mp4"
        - "Внутренний sync по Q2 KPI.mp3"

    - artifact: "Скриншоты дашбордов и метрик"
      destination: "raw/media/unsorted/"
      examples:
        - "GA4-conversion-funnel.png"
        - "Mixpanel-retention.png"
      knowledge_target: "knowledge/domain/metrics.md"

    - artifact: "Брендбуки и tone-of-voice гайды"
      destination: "raw/reference/unsorted/"
      examples:
        - "Brand Guidelines v3.pdf"
        - "Tone of Voice Manifesto.md"
      knowledge_target: "knowledge/voice/brand-voice.md"

    - artifact: "Анализ конкурентов и benchmarks"
      destination: "raw/reference/unsorted/"
      examples:
        - "Competitor X — site teardown.md"
        - "SimilarWeb-export-march-2026.csv"
      knowledge_target: "knowledge/domain/competitors.md"

    - artifact: "Экспорты отзывов клиентов и интервью"
      destination: "raw/work/unsorted/"
      examples:
        - "Customer-interviews-batch-12.md"
        - "App Store reviews export.csv"
      knowledge_target: "knowledge/domain/audience.md"

  quickstart:
    - "Любой брендбук в PDF → raw/documents/unsorted/"
    - "Презентация последней успешной кампании → raw/documents/unsorted/"
    - "1-2 customer interview transcripts → raw/work/unsorted/"
    - "Запусти ./shell/reindex.sh — AI получит понимание твоего бренда"
    - "Спроси AI: 'Напиши мне draft email на нашем tone of voice про X' — увидишь разницу"

  do_not_drop:
    - "Персональные данные клиентов (PII): имена, email, телефоны"
    - "Коммерческая тайна без явного разрешения"
    - "Контракты и финансовые документы третьих лиц"
    - "Приватные переписки сотрудников"
    - "NDA-материалы партнёров"
